name: CI
on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install system audio conversion
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install package and developer tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build
      - name: Ruff lint
        run: ruff check .
      - name: Ruff formatting
        run: ruff format --diff . || true
      - name: Mypy
        run: mypy src
      - name: Pytest
        run: pytest -q
      - name: Deterministic evaluation
        run: python evaluations/run.py
      - name: Build wheel and source distribution
        run: python -m build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build self-contained container
        run: docker build --tag voice-ai-agent:ci .
